name: Verify TRD Journey

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run regression tests
        run: npm test

      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firestore rules
        run: |
          npm ci --prefix functions
          npx firebase-tools emulators:exec --only firestore --project demo-trd-audit 'node --test tests/firestore-rules.test.cjs'

      - name: Prepare public files
        run: npm run prepare:hosting
